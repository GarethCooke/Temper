[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temper"
version = "0.1.0.dev0"
description = "A reinforcement-learning execution agent graded against its own analytic oracle"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["temper", "temper.agents", "temper.env", "temper.eval", "temper.oracle"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `temper` imports without an install step, so `make test` works from a clean clone.
pythonpath = ["."]
# `make test` is the gate and has to stay evening-sized, so anything measured in
# minutes is opt-in. `make differential` runs M1's deep tier, `make smoke` the PPO
# convergence check, `make sweep` M2's 5-seed regeneration; all three are
# milestone acceptance gates rather than per-commit ones.
addopts = "-q --strict-markers --strict-config -m 'not deep and not training and not anvil'"
markers = [
  "deep: the acceptance-gate differential tier — minutes, not seconds (make differential)",
  "training: runs a training loop — minutes to hours (make smoke, make sweep)",
  "anvil: needs a live anvil_server on the configured port (make anvil-check)",
]
# A warning in the reference engine is a defect in the reference engine.
filterwarnings = ["error"]
