# M4a — the power-law world: the project's first *earned* advantage.
#
# The env's temporary impact becomes FrontierView's calibrated 0.6-power law —
# the vendored mis-specification, not an invented one — and the agent is required
# to find that world's own optimum while the Almgren-Chriss schedule, derived at
# the tangent eta_tilde, does not.
#
# Everything here except the world and the graded encoding is
# configs/m3_frontier/lambda_1e-3.5.yaml's, which is M2's control-variate config
# with ten seeds and the antithetic regime. That is deliberate and it is what
# makes the result comparable: same case, same lambda, same seed addressing, same
# reward scale, same estimator, same PPO hyperparameters, same update budget.
# Hyperparameter search is out of scope — if it does not train in the power-law
# world that is a finding, not a reason to tune.

milestone: M4a
brief: docs/briefs/M4a-power-law-world.md

# --- the world (task 2) -----------------------------------------------------
# Named, never inherited. Constitution §4: Phase-2 models are additive
# alternatives behind the same interface, never silent modifications of Phase 1 —
# so a config in a Phase-2 world has to say so in its own bytes, and
# tests/test_repo_invariants.py refuses one that does not. The env injects
# temper.env.impact.PowerLawTemporary; permanent impact, the half-spread and the
# shock model are Phase 1's, untouched.
#
# The graded encoding follows from this and is not a second switch: a metric
# grades the world that charges it (ARCHITECTURE.md §9), so the registry is asked
# for the metrics of *this* encoding and the grader refuses any other.
world:
  cost_encoding: power_law

# --- the case ---------------------------------------------------------------
# M2's and M3's, unchanged. The symbol parameters and the grid are FrontierView's,
# repeated here rather than read out of tests/golden/vendor/ because that fixture
# is test data; tests/test_m2_reference.py compares every field against the
# golden case named by `params_from`.
case:
  id: frontier
  params_from: core:AAPL:X100000:T6.5:lam1e-05
  symbol: AAPL
  order_size: 100000.0
  horizon_hours: 6.5
  n_bins: 13
  params:
    adv: 60000000
    sigma: 0.0155
    half_spread: 0.3
    eta: 0.142
    gamma: 0.314

# --- task 0: how lambda was fixed, in both worlds ---------------------------
# M2's selection rule, unchanged, applied to the power-law table:
#   (i)  (J_twap - J_optimal) / J_optimal >= 0.20
#   (ii) the optimum's largest single-bin fraction <= 0.50
# read off *this world's* optimum. It selects 10^-3.5 — the same lambda M2 and M3
# committed — with a TWAP gap of 62.37 % and a largest bin of 42.25 % of X. At
# 10^-4 condition (i) fails (gap 17.97 %).
#
# `Experiment.verify_lambda_rule` applies the rule to *every* world's table and
# refuses to run unless they agree. A Phase-2 milestone whose lambda was chosen by
# a different rule than the Phase-1 results it is compared against is not
# comparable to them.
lambda_selection:
  grid: vendor
  rule:
    min_twap_gap: 0.20
    max_bin_fraction: 0.50
  lambda_risk: 0.00031622776601683794       # 10^-3.5

# --- the pre-stated bar -----------------------------------------------------
# The denominator is the milestone. M2 and M3 stated epsilon as a fraction of the
# TWAP gap, which is portable across lambda and is the right unit for a
# rediscovery claim. It is the *wrong* unit here, and not by a little: at this
# lambda the whole available advantage — what the tangent-derived closed form
# leaves on the table, J_opt(tangent) - J_pow* — is 0.03674 bps, while 5 % of the
# TWAP gap is 0.07433 bps. An agent held to the old bar could capture **none** of
# the mis-specification this milestone exists to measure and still pass by a
# factor of two.
#
# So the bars are fractions of the available advantage:
#   median   excess over J_pow* <= 5 %  ==> capture fraction c >= 0.95
#   per seed excess over J_pow* <= 10 % ==> c >= 0.90
# The median bar is 0.00184 bps in absolute terms. M3 measured a median excess of
# 0.00013 bps at this lambda in the linear world, so there is 13.9x headroom
# against a measured precedent rather than against a hope.
tolerances:
  denominator: available_advantage
  epsilon_fraction: 0.05
  per_seed_fraction: 0.10
  # J_agent < J_pow* - red_flag_rtol * |J_pow*| is a hard failure on every seed,
  # never a reported result: the optimum is *certified* in task 1 (Cholesky PD,
  # KKT residual 1.2e-15, 3 600 perturbations uphill, an independent solver
  # agreeing to 3.1e-15 of X), so a strictly lower objective is a defect in the
  # metric, the env or the grading path.
  red_flag_rtol: 1.0e-9

# --- randomness -------------------------------------------------------------
# M3's addressing exactly, so seed ordinal i occupies the same streams it did in
# the linear world and the two results are seed-for-seed comparable.
seeding:
  root_seed: 20260805
  train_pool: train
  eval_pool: eval
  n_seeds: 10
  env_stream_stride: 4096
  eval_streams: [0, 1]

# --- the estimator ----------------------------------------------------------
# M3's antithetic pairing, and M4a task 4 checked before this ran that it still
# cancels *exactly* in this world: the power law replaces the temporary term,
# which is a function of the schedule and carries no shock, so realised cost stays
# affine in the draws and the pair still averages the noise away to 1.8e-15 bps
# per step. That is the narrower true version of ARCHITECTURE.md §9's "does not
# exist in Phase 2".
estimator:
  regime: antithetic
  claim: >-
    PPO trained on the antithetic-averaged reward in FrontierView's calibrated
    0.6-power temporary-impact world: each episode is run as the pair (xi, -xi) —
    the same actions against the shock path and its exact negation — and the two
    realised rewards are averaged. The observation carries no price and the power
    law replaces a term that carries no shock, so both halves take identical
    actions and the noise still cancels exactly on the average; M4a task 4
    measured that at 1.8e-15 bps per step before this run started, along with the
    exact per-episode noise identity, the pair's action identity and the
    open-loop schedule check. The agent is graded analytically against the
    *certified* optimum of the power-law world, not against the Almgren-Chriss
    schedule, which is derived at the tangent to that world's impact function and
    therefore does not solve it. This is NOT a claim about learning under noise,
    and NOT a claim about real fills: it is a claim that RL finds the optimum of a
    world whose closed form is derived at a tangent, inside a synthetic AC-shaped
    market, where that tangent costs 1.54 % of expected cost.

# --- reward scaling ---------------------------------------------------------
# M2's committed constant, unchanged, and checked rather than assumed: it was set
# against a Phase-1 objective of 2.3546 bps and the power-law objective at this
# lambda is 2.3832 bps — 1.2 % apart, so the scale carries at the episode level.
# The per-step charge is more front-loaded under the power law; tools/train.py
# records the scaled per-step reward range before training so the check is an
# artefact rather than an assurance.
reward:
  scale: 0.02

# --- PPO --------------------------------------------------------------------
# M3's frontier-point budget, verbatim. Out of scope: hyperparameter search.
ppo:
  total_timesteps: 5000000
  num_envs: 512
  num_steps: 13
  learning_rate: 1.0e-3
  anneal_lr: true
  gamma: 1.0
  gae_lambda: 1.0
  num_minibatches: 4
  update_epochs: 10
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  norm_adv: true
  torch_threads: 8
  hidden_sizes: [64, 64]
  log_std_init: -1.0
  max_seconds: 5400
runtime:
  seconds_per_seed: 1200
  sweep_seconds: 12000
results:
  metrics: results/m4a_power_law.json
  figure: results/m4a_trajectory_overlay
  formats: [png]
  trace_points: 128
