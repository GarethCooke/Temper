# M4b — the stochastic-liquidity world: the differential (invariant 6).
#
# Committed input to `tests/test_m4b_differential.py`. That test reads *this
# file*, not literals: constitution invariant 3 fixes thresholds before the work,
# and a threshold that lives in a test body is a threshold that drifts to fit the
# run. Every number here is pre-stated in docs/briefs/M4b-stochastic-liquidity.md
# and may only be loosened by amending that brief first.
#
# Its own file rather than an edit to configs/m4a_differential.yaml, for the same
# reason M4a's was its own rather than an edit to M1's: that file is the committed
# input to the power-law tests and its bytes are the only thing standing between
# M4a's pre-stated bands and a later session's idea of them.

brief: docs/briefs/M4b-stochastic-liquidity.md

# --- the world --------------------------------------------------------------
# TWO seams, neither inherited (constitution §4). The cost encoding is M4a's
# power law; the liquidity is M4b's own INVENTED per-bin i.i.d. lognormal
# multiplier on v_hourly. Permanent impact, the half-spread and the shock model
# are Phase 1's, untouched — which is the whole reason half of M1's differential
# carries over unchanged.
world:
  cost_encoding: power_law
  liquidity:
    model: lognormal
    sigma_log: 0.5

canonical_bins: 13

# --- randomness -------------------------------------------------------------
# Its own pool for the price stream, and liquidity draws from m4b/liquidity-eval
# via the env's own second address — never the price generator, or every
# committed Phase-1 and M4a shock would move. Streams are addressed, not drawn:
# stream_index = stream_base + case_ordinal * n_schedules + schedule_ordinal over
# the `cases` and `schedules` lists in their committed order.
seeding:
  root_seed: 20260823
  pool: m4b/differential       # never `train` or `eval` — invariant 5
  process_stream: 800          # the liquidity process's own moment checks

# --- schedules under test ---------------------------------------------------
# Five. `static` is the liquidity world's own optimum — the best fixed schedule
# that knows the law — and `m4a` is the power-law optimum that knows no liquidity
# at all. Both are here because the level shift between them is this milestone's
# most load-bearing small number, and a differential that never priced either
# would not have checked the env charges them as the closed form says.
# Order fixes the stream addressing above, so it is part of the committed contract.
schedules: [twap, ac, tangent, m4a, static]

# --- the Monte-Carlo tiers --------------------------------------------------
# TWO checks per cell, and the split is the finding rather than a convenience.
#
# (a) CONDITIONAL. z = (C - E[cost | L]) / sqrt(V), standardised per episode
#     against its OWN realised liquidity path. Exactly N(0, 1) under the null:
#     liquidity enters E[cost] and not V at all, so conditioned on the path a
#     deterministic schedule's shortfall is still a fixed linear combination of
#     independent Gaussian shocks. M1's exact bands therefore survive verbatim —
#     no chi-squared quantile, no scipy — and this is the check that says the
#     price model and the conditional cost function still agree.
#
#       |mean(z)|    <= mean_z_sigmas / sqrt(N)
#       |var(z) - 1| <= var_z_sigmas * sqrt(2 / N)
#
# (b) UNCONDITIONAL. The sample mean cost against the closed form
#     A*E[L^-0.6]*sum w^(1+0.6) + permanent + spread. NOT exact — realised cost
#     is no longer Gaussian once the liquidity noise is in it — so the band is a
#     sample-standard-error one and says so. This is the check that would catch
#     the multiplier being applied with the wrong power or the wrong sign, which
#     (a) cannot see: (a) conditions the mistake away.
tiers:
  fast:
    # In `make test`. One case per symbol at the middle lambda.
    n_sim: 10000
    mean_z_sigmas: 4.0
    var_z_sigmas: 4.0
    mean_cost_sigmas: 4.0
    stream_base: 0
    runtime_budget_seconds: 180
    expected_steps: 1950000     # 15 cells x 10 000 x 13
    cases:
      - core:AAPL:X100000:T6.5:lam1e-05
      - core:MSFT:X250000:T6.5:lam1e-05
      - core:JPM:X500000:T6.5:lam1e-05
  deep:
    # `make differential`, marker `deep`. The acceptance gate: the full 3 x 3
    # golden grid at M1's N_sim.
    n_sim: 200000
    mean_z_sigmas: 4.0
    var_z_sigmas: 4.0
    mean_cost_sigmas: 4.0
    stream_base: 100
    runtime_budget_seconds: 2400
    expected_steps: 117000000   # 45 cells x 200 000 x 13
    cases:
      - core:AAPL:X100000:T6.5:lam1e-07
      - core:AAPL:X100000:T6.5:lam1e-05
      - core:AAPL:X100000:T6.5:lam0.001
      - core:MSFT:X250000:T6.5:lam1e-07
      - core:MSFT:X250000:T6.5:lam1e-05
      - core:MSFT:X250000:T6.5:lam0.001
      - core:JPM:X500000:T6.5:lam1e-07
      - core:JPM:X500000:T6.5:lam1e-05
      - core:JPM:X500000:T6.5:lam0.001

# --- the process itself (task 4's first half) -------------------------------
# The env's own draws against the oracle's closed forms — two deliberately
# different routes to one distribution. E[L] = 1 is by construction and is the
# one a dropped Jensen correction would break; E[L^-0.6] is what the whole static
# rung is priced by; the lag-1 autocorrelation is what "i.i.d." means here, and
# i.i.d. is what makes (k, x_k, L_k) a sufficient statistic and therefore what
# makes the dynamic program the optimum over ALL adapted policies rather than
# only over the ones with that observation.
process:
  draws: 500000                # episodes x bins from the env's own stream
  mean_sigmas: 4.0             # |mean(L) - 1| <= sigmas * sd / sqrt(n)
  variance_rtol: 0.02          # sample variance against exp(sigma^2) - 1
  inverse_moment_rtol: 0.01    # sample E[L^-0.6] against the closed form
  autocorrelation_sigmas: 4.0  # lag-1, against its own 1/sqrt(n) null
